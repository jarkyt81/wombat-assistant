<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Wombat Settings</title>
        <link href="bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                width: 260px;
                background-color:rgba(187, 146, 104, 0.445);
                padding: 15px;
            }
        </style>
    </head>
    <body>
        <h5 class="fw-bold mb-3" style="color:rgba(255, 255, 255, 0.932)">Wombat</h5>
        <div class="setting-row form-field">
            <div class="switch">
                <input type="checkbox" id="toggle-antidoomscroll">
            </div>
            <label for="toggle-antidoomscroll" class="fw-medium text-sm ms-2">
                Enable Anti-DoomScroll
            </label>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
